<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Lenga Editorial — cartografía ilustrada de Chiloé. Sitio en construcción." />
    <title>Lenga Editorial</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- gtag.js se carga desde JS (src/analytics/gtag.js); el preconnect
         adelanta el handshake para que el primer page_view no llegue tarde. -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <!-- Fallbacks del design system: Montserrat ≈ Mont, Barlow ≈ Cooper Hewitt.
         Al tener los archivos licenciados, agregar @font-face y las familias
         'Mont' / 'Cooper Hewitt' (primeras en los stacks) toman el control. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,800;1,700&family=Barlow:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
